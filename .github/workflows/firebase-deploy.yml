# Publica el sitio en Firebase Hosting (sitio estático, sin compilación):
#  - push a master    → sitio en producción (restaurante-las-vegas.web.app)
#  - pull request     → enlace de vista previa temporal comentado en el PR
name: Desplegar en Firebase Hosting

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESTAURANTE_LAS_VEGAS }}
          projectId: restaurante-las-vegas
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
